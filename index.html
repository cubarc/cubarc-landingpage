<script>
const reduce = false;
function Synapsen(canvas, opt) {
  const ctx = canvas.getContext('2d');
  const o = Object.assign({ n: 64, reach: 130, line: '240,183,119', dot: '247,212,154', alpha: 0.55, pulses: 7 }, opt);
  let w = 0, h = 0, dpr = 1, form = 0, formGoal = 0, on = true;
  const rnd = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(o.seed || 7);
  const N = o.n;
  // Anordnungen in 0…1-Koordinaten
  const F = [[], [], [], [], []];
  const cols = Math.ceil(Math.sqrt(N * 1.6)), rows = Math.ceil(N / cols);
  for (let i = 0; i < N; i++) {
    F[0].push([rnd(), rnd()]);                                                     // gestreut
    F[1].push([0.08 + 0.84 * ((i * 0.618) % 1), (i / N + rnd() * 0.15) % 1]);      // steigend
    F[2].push([(0.5 + i % cols) / cols + (rnd() - .5) * .03, (0.5 + Math.floor(i / cols)) / rows + (rnd() - .5) * .03]); // Raster
    const a = i / N * Math.PI * 2, r = 0.28 + (i % 3) * 0.07;
    F[3].push([0.5 + Math.cos(a) * r * 0.75, 0.5 + Math.sin(a) * r]);              // Ring
    const b = rnd() * Math.PI * 2, q = 0.06 + rnd() * 0.18;
    F[4].push([0.5 + Math.cos(b) * q, 0.5 + Math.sin(b) * q]);                     // sammelnd
  }
  const ph = Array.from({ length: N }, () => [rnd() * 6.3, rnd() * 6.3, 0.6 + rnd() * 0.8]);
  const pulses = Array.from({ length: o.pulses }, () => ({ a: 0, b: 1, t: rnd(), v: 0.0025 + rnd() * 0.003 }));
  const pos = Array.from({ length: N }, () => [0, 0]);
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    if (Math.abs(r.width - w) < 2 && Math.abs(r.height - h) < 2 && w) return;
    w = r.width; h = r.height; canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  function frame(time) {
    if (!on || !w) return;
    form += (formGoal - form) * 0.035;
    const fa = Math.floor(form), fb = Math.min(4, fa + 1), t = form - fa;
    const tt = t * t * (3 - 2 * t);
    const drift = (reduce ? 0 : 1) * Math.min(w, h) * 0.025;
    const rise = (reduce ? 0 : time * 0.00002) % 1;
    for (let i = 0; i < N; i++) {
      const A = F[fa][i], B = F[fb][i];
      let x = A[0] + (B[0] - A[0]) * tt, y = A[1] + (B[1] - A[1]) * tt;
      if (fa === 1 || fb === 1) { const k = fa === 1 ? 1 - tt : tt; y = (y - rise * k + 1) % 1; }
      const p = ph[i];
      pos[i][0] = x * w + Math.sin(time * 0.00021 * p[2] + p[0]) * drift;
      pos[i][1] = y * h + Math.cos(time * 0.00017 * p[2] + p[1]) * drift;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const R = o.reach, R2 = R * R;
    ctx.lineWidth = 1;
    const near = [];
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const dx = pos[i][0] - pos[j][0], dy = pos[i][1] - pos[j][1], d2 = dx * dx + dy * dy;
      if (d2 > R2) continue;
      const a = (1 - Math.sqrt(d2) / R) * 0.42 * o.alpha;
      ctx.strokeStyle = `rgba(${o.line},${a.toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(pos[i][0], pos[i][1]); ctx.lineTo(pos[j][0], pos[j][1]); ctx.stroke();
      if (a > 0.08 * o.alpha) near.push([i, j]);
    }
    for (let i = 0; i < N; i++) {
      const big = i % 9 === 0;
      ctx.fillStyle = `rgba(${o.dot},${(big ? 0.75 : 0.45) * o.alpha})`;
      ctx.beginPath(); ctx.arc(pos[i][0], pos[i][1], big ? 2.1 : 1.3, 0, 7); ctx.fill();
    }
    // Impulse wandern entlang der Verbindungen
    if (!reduce && near.length) pulses.forEach((pu, k) => {
      pu.t += pu.v;
      if (pu.t >= 1 || pu.b >= N) { const e = near[(k * 7 + Math.floor(time / 900)) % near.length]; pu.a = e[0]; pu.b = e[1]; pu.t = 0; }
      const A = pos[pu.a], B = pos[pu.b];
      const x = A[0] + (B[0] - A[0]) * pu.t, y = A[1] + (B[1] - A[1]) * pu.t;
      const fade = Math.sin(pu.t * Math.PI);
      ctx.fillStyle = `rgba(${o.dot},${(0.9 * fade * o.alpha).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill();
      ctx.fillStyle = `rgba(${o.line},${(0.18 * fade * o.alpha).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
    });
  }
  return { size, frame, setForm: f => { formGoal = f; }, setOn: v => { on = v; }, get canvas() { return canvas; } };
}


const SMALL = innerWidth < 700;
const syn = Synapsen(document.getElementById('syn-bg'), { n: SMALL ? 34 : 64, reach: SMALL ? 105 : 150, alpha: 0.5, seed: 11 });
const FORMS = [[0, 1400], [3, 7000], [4, 2600], [3, 5200], [0, 4200]];
let fi = 0, fNext = 0;
function synTick(t) { if (t > fNext) { syn.setForm(FORMS[fi][0]); fNext = t + FORMS[fi][1]; fi = fi + 1 < FORMS.length ? fi + 1 : 1; } syn.frame(t); requestAnimationFrame(synTick); }
addEventListener('resize', () => syn.size());
syn.size(); requestAnimationFrame(synTick);
</script>

</body>
